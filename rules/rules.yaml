# ==============================================================
#  aivancity Tech Club · GDG on Campus aivancity
#  OFFICIAL POINTS & RANKS RULEBOOK. THIS FILE IS THE SOURCE OF TRUTH.
#
#  The website and the points platform read this file directly.
#  If a rule is not in this file, it does not exist.
#
#  How this file changes (see rules/GOVERNANCE.md):
#   - Only through a pull request, approved by at least 2 organizers.
#   - Changes take effect at the start of the NEXT season.
#   - A change can never remove points or a bandana already earned.
# ==============================================================

version: "1.7.0"   # 1.7.0 (13/11/2026): contribution points cover work for the club as well as events, with a published scale
                   # 1.6.0 (13/11/2026): organizers can give event-contribution points (up to 10 per award)
effective_from: "2026-10-15"     # first Thursday session of Fall 2026

# --------------------------------------------------------------
# SEASONS
# Lifetime points decide your bandana and never reset.
# Season points reset each semester and decide the Season Champion.
# --------------------------------------------------------------
seasons:
  - id: fall-2026
    name: "Fall 2026"
    name_fr: "Automne 2026"
    start: "2026-09-01"
    end: "2027-01-31"
  - id: spring-2027
    name: "Spring 2027"
    name_fr: "Printemps 2027"
    start: "2027-02-01"
    end: "2027-08-31"

# --------------------------------------------------------------
# SESSIONS
# --------------------------------------------------------------
sessions:
  regular:
    day: thursday
    start: "13:00"
    end: "14:00"
    timezone: "Europe/Paris"
    room: "AIClinic – Room 107"
  check_in:
    # A new code is shown on screen at every session.
    # In-person and remote attendance count the same.
    remote_allowed: true
    code_valid_from: "13:00"
    code_valid_until: "14:15"
  point_cap_per_regular_session: 15   # does not apply to double-points events

# --------------------------------------------------------------
# POINT RULES
# Every rule names the FACT that triggers it and WHO records it.
# Organizers record facts. They never choose point amounts,
# with one exception: contribution points (event_bonus), given on the published scale below.
# --------------------------------------------------------------
rules:

  # ---------- Show up ----------
  - id: attend
    category: show_up
    name: "Attend a session"
    points: 1
    trigger: "Valid check-in code entered during the check-in window."
    recorded_by: member
    limit: "Once per session."
    name_fr: "Venir à une séance"
    trigger_fr: "Code de présence valide saisi pendant la fenêtre d'enregistrement."
    limit_fr: "Une fois par séance."

  - id: streak
    category: show_up
    name: "Attendance streak"
    points: 2
    trigger: "Every 4th consecutive regular session attended."
    recorded_by: automatic
    notes: "Cancelled sessions do not break a streak."
    name_fr: "Série de présences"
    trigger_fr: "Toutes les 4 séances régulières consécutives."
    notes_fr: "Une séance annulée ne casse pas la série."

  - id: referral
    category: show_up
    name: "Bring a new member"
    points: 2
    trigger: "A new member names you as referrer at their first check-in."
    recorded_by: automatic
    limit: "Once per new member."
    name_fr: "Faire venir un nouveau membre"
    trigger_fr: "Un nouveau membre vous indique comme parrain à son premier enregistrement."
    limit_fr: "Une fois par nouveau membre."

  - id: starter
    category: show_up
    name: "Take a getting-started step"
    points: 1
    trigger: "Set up your camp, visit the Village board, open a mission, or ask someone to be your buddy."
    recorded_by: automatic
    limit: "Once per step (4 steps)."
    name_fr: "Faire une étape de démarrage"
    trigger_fr: "Installer votre camp, visiter le Village board, ouvrir une mission, ou proposer un binôme."
    limit_fr: "Une fois par étape (4 étapes)."

  - id: buddy_session
    category: show_up
    name: "Come with your buddy"
    points: 2
    trigger: "You and your Renkei buddy both check in at the same session."
    recorded_by: automatic
    limit: "Once per session."
    name_fr: "Venir avec votre binôme"
    trigger_fr: "Vous et votre binôme Renkei pointez à la même séance."
    limit_fr: "Une fois par séance."

  # ---------- Compete ----------
  - id: compete_enter
    category: compete
    name: "Enter a competition"
    points: 2
    trigger: "Member appears on the final results of a competition."
    recorded_by: organizer
    name_fr: "Participer à une compétition"
    trigger_fr: "Le membre figure dans les résultats finaux d'une compétition."

  - id: compete_place_solo
    category: compete
    name: "Place in a solo competition"
    points: { 1: 10, 2: 6, 3: 4 }
    trigger: "Final ranking entered for a solo competition."
    recorded_by: organizer
    notes: "Tied players each receive the points of the higher place. Added on top of the points for entering."
    name_fr: "Podium en compétition individuelle"
    trigger_fr: "Classement final saisi pour une compétition individuelle."
    notes_fr: "En cas d'égalité, chaque joueur reçoit les points de la meilleure place. S'ajoute aux points de participation."

  - id: compete_place_team
    category: compete
    name: "Place in a team competition"
    points: { 1: 8, 2: 5, 3: 3 }
    trigger: "Final ranking entered for a team competition."
    recorded_by: organizer
    notes: "Every registered team member receives the points. Teams must be registered before the start."
    name_fr: "Podium en compétition par équipe"
    trigger_fr: "Classement final saisi pour une compétition par équipe."
    notes_fr: "Chaque membre inscrit de l'équipe reçoit les points. Les équipes doivent être inscrites avant le départ."

  # ---------- Share ----------
  - id: talk_lightning
    category: share
    name: "Give a lightning talk or demo"
    points: 5
    trigger: "Talk of 10 minutes or less, delivered at a session."
    recorded_by: organizer
    conditions:
      - "Listed on the published schedule at least 3 days before."
      - "At least 5 check-ins at that session."
    name_fr: "Faire un lightning talk ou une démo"
    trigger_fr: "Présentation de 10 minutes maximum lors d'une séance."
    conditions_fr:
      - "Inscrit au programme publié au moins 3 jours avant."
      - "Au moins 5 enregistrements à cette séance."

  - id: workshop
    category: share
    name: "Give a workshop"
    points: 10
    trigger: "Session of 30 minutes or more led by the member."
    recorded_by: organizer
    conditions:
      - "Listed on the published schedule at least 3 days before."
      - "At least 5 check-ins at that session."
    name_fr: "Animer un atelier"
    trigger_fr: "Séance de 30 minutes ou plus animée par le membre."
    conditions_fr:
      - "Inscrit au programme publié au moins 3 jours avant."
      - "Au moins 5 enregistrements à cette séance."

  - id: host_event
    category: share
    name: "Host an event"
    points: 10
    trigger: "Member is named as host of an event on the published schedule."
    recorded_by: organizer
    conditions:
      - "At least 10 check-ins at the event (remote included)."
    name_fr: "Organiser un événement"
    trigger_fr: "Le membre est indiqué comme organisateur d'un événement au programme publié."
    conditions_fr:
      - "Au moins 10 enregistrements à l'événement (à distance compris)."

  - id: event_bonus             # id kept so points already given stay valid
    category: share
    name: "Contribute to the club or an event"
    points: 0
    points_max: 10
    trigger: "An organizer gives you points for work you did for the club or for an event that no other rule covers: preparing food, filming, setting up or cleaning up, solving the riddles of a game, posting for the club, building or hosting something the club uses."
    notes: "Each award is entered separately, with what it was for, and appears in your history on the Mountain."
    recorded_by: organizer
    conditions:
      - "1 to 2 points: a small help, up to about an hour (a useful suggestion, one riddle solved, filming, clean-up, sharing a post)."
      - "3 to 5 points: a real task of a few hours (several riddles, a post or story made for the club, setting up a room, helping the host with part of an event's organization)."
      - "6 to 10 points: a big piece of work, a day or more, or something the club keeps using (preparing the food for an event, building a platform or tool for the club)."
      - "Up to 10 points per award. Several different contributions can each get their own award."
      - "Not for what another rule already counts (attending, a talk or workshop, hosting the event, a competition, a Village Board mission)."
      - "An organizer never gives these points to themself: another organizer does."
    name_fr: "Contribuer au club ou à un événement"
    trigger_fr: "Un organisateur vous attribue des points pour un travail fait pour le club ou pour un événement, qu'aucune autre règle ne couvre : préparer la nourriture, filmer, installer ou ranger, résoudre les énigmes d'un jeu, publier pour le club, construire ou héberger un outil que le club utilise."
    notes_fr: "Chaque attribution est saisie à part, avec ce pour quoi elle est donnée, et apparaît dans votre historique sur la Montagne."
    conditions_fr:
      - "1 à 2 points : une petite aide, jusqu'à environ une heure (une suggestion utile, une énigme résolue, filmer, ranger, partager une publication)."
      - "3 à 5 points : une vraie tâche de quelques heures (plusieurs énigmes, une publication ou une story faite pour le club, installer une salle, aider l'organisateur sur une partie de l'événement)."
      - "6 à 10 points : un gros travail, une journée ou plus, ou quelque chose que le club continue d'utiliser (préparer la nourriture d'un événement, construire une plateforme ou un outil pour le club)."
      - "Jusqu'à 10 points par attribution. Plusieurs contributions différentes peuvent chacune avoir leur attribution."
      - "Pas pour ce qu'une autre règle compte déjà (venir, une présentation ou un atelier, organiser l'événement, une compétition, une mission du Tableau du village)."
      - "Un organisateur ne s'attribue jamais ces points lui-même : c'est un autre organisateur qui le fait."

  # ---------- Build ----------
  - id: ship_project
    category: build
    name: "Ship a project"
    points: 8
    trigger: "Public GitHub repository presented in a demo slot."
    recorded_by: member
    verified_by: organizer
    conditions:
      - "Demo slot follows the same conditions as a lightning talk."
    limit: "Once per repository."
    name_fr: "Livrer un projet"
    trigger_fr: "Dépôt GitHub public présenté lors d'un créneau de démo."
    limit_fr: "Une fois par dépôt."
    conditions_fr:
      - "Le créneau de démo suit les mêmes conditions qu'un lightning talk."

  - id: club_contribution
    category: build
    name: "Contribute to a club repository"
    points: 3
    trigger: "Pull request merged into a club repository by someone other than its author."
    recorded_by: automatic
    limit: "Max 3 per calendar month."
    name_fr: "Contribuer à un dépôt du club"
    trigger_fr: "Pull request fusionnée dans un dépôt du club par une autre personne que son auteur."
    limit_fr: "3 maximum par mois."

  - id: open_source
    category: build
    name: "Contribute to open source"
    points: 5
    trigger: "Link to a merged pull request in a public repository the member does not own."
    recorded_by: member
    verified_by: organizer
    limit: "Max 2 per calendar month."
    name_fr: "Contribuer à l'open source"
    trigger_fr: "Lien vers une pull request fusionnée dans un dépôt public qui n'appartient pas au membre."
    limit_fr: "2 maximum par mois."

  # ---------- Learn ----------
  - id: skill_badge
    category: learn
    name: "Complete a study jam or skill badge"
    points: 3
    trigger: "Public credential link submitted."
    recorded_by: member
    verified_by: organizer
    name_fr: "Terminer un study jam ou un skill badge"
    trigger_fr: "Lien public vers le badge envoyé."

  - id: certification
    category: learn
    name: "Earn a professional certification"
    points: 15
    trigger: "Verifiable credential link submitted (e.g. Credly, Google Cloud)."
    recorded_by: member
    verified_by: organizer
    name_fr: "Obtenir une certification professionnelle"
    trigger_fr: "Lien vérifiable vers la certification envoyé (ex. Credly, Google Cloud)."

  # ---------- Help ----------
  - id: mentoring
    category: help
    name: "Mentoring session"
    points: 3
    trigger: "Mentor and mentee BOTH confirm the session on the platform."
    recorded_by: member
    verified_by: organizer
    limit: "Max 1 per week per mentor/mentee pair. Points go to the mentor."
    name_fr: "Séance de mentorat"
    trigger_fr: "Le mentor et le mentoré confirment TOUS LES DEUX la séance sur la plateforme."
    limit_fr: "1 maximum par semaine et par binôme. Les points vont au mentor."
    notes: "A finished Help mission on the Village Board counts as a mentoring session: the member who asked confirms it."
    notes_fr: "Une mission d'aide terminée sur le Tableau du village compte comme une séance de mentorat : le membre qui a demandé la confirme."

  - id: collab
    category: build
    name: "Build together (Village Board mission)"
    points: 5
    trigger: "A member finishes a Build mission on someone else's project, and the member who posted it confirms."
    recorded_by: member
    limit: "Max 2 per calendar month."
    name_fr: "Construire ensemble (mission du Tableau du village)"
    trigger_fr: "Un membre termine une mission Construire sur le projet de quelqu'un d'autre, et le membre qui l'a publiée confirme."
    limit_fr: "2 maximum par mois."

  - id: club_quest
    category: help
    name: "Club work (Village Board mission)"
    points: 4
    trigger: "A member finishes a Club work mission (content, events, audits for the club), and the member who posted it confirms."
    recorded_by: member
    limit: "Max 2 per calendar month."
    name_fr: "Travail pour le club (mission du Tableau du village)"
    trigger_fr: "Un membre termine une mission Travail pour le club (contenu, événements, audits), et le membre qui l'a publiée confirme."
    limit_fr: "2 maximum par mois."

# --------------------------------------------------------------
# VILLAGE BOARD MISSIONS
# A mission never sets its own reward: it pays what its rule above pays.
#   help  -> mentoring (3 pts)    build -> collab (5 pts)    club -> club_quest (4 pts)
# --------------------------------------------------------------
missions:
  types: { help: mentoring, build: collab, club: club_quest }
  monthly_cap: 10               # points per member per calendar month from missions, all types together
  one_at_a_time: true           # finish or release your mission before taking another
  reopen_after_days: 7          # a taken mission with no update for 7 days goes back on the board
  confirm_within_days: 7        # if the poster doesn't confirm, an organizer decides

# --------------------------------------------------------------
# RENKEI BUDDIES
# In Renkei Ninjutsu, two ninjas combine their techniques.
# Buddies earn no points by themselves: they learn together.
# --------------------------------------------------------------
buddies:
  - text: "Any member can send a buddy request to another member, from their camp or from My climb on the Mountain."
    text_fr: "Tout membre peut envoyer une demande de binôme à un autre membre, depuis son camp ou depuis Mon ascension sur la Montagne."
  - text: "Nobody is paired by force: a request only counts once the other person accepts it."
    text_fr: "Personne n'est mis en binôme de force : une demande ne compte que si l'autre personne l'accepte."
  - text: "Until it is accepted, a request can be withdrawn by the sender or declined by the other person."
    text_fr: "Tant qu'elle n'est pas acceptée, une demande peut être retirée par celui ou celle qui l'a envoyée, ou refusée par l'autre personne."
  - text: "Once accepted, the two members are tied together. Ending a pair takes both: one asks, the other agrees. Organizers can also undo a pair."
    text_fr: "Une fois acceptée, les deux membres sont liés. Défaire un binôme demande l'accord des deux : l'un le demande, l'autre accepte. Les organisateurs peuvent aussi défaire un binôme."
  - text: "You can have more than one buddy. Every pair is shown on both members' camps."
    text_fr: "Vous pouvez avoir plusieurs binômes. Chaque binôme apparaît sur le camp des deux membres."

# --------------------------------------------------------------
# VERIFICATION OF MEMBER SUBMISSIONS
# Anything a member submits (rules marked "verified_by: organizer")
# stays PENDING and earns nothing until an organizer verifies it.
# Organizers only answer one question: "Does this proof match the rule?"
# They never choose the number of points (contribution points are the one exception, see event_bonus).
# --------------------------------------------------------------
verification:
  applies_to: [ship_project, open_source, skill_badge, certification, mentoring]
  not_needed_for: "Check-ins (session code) and changes merged into club repositories (detected from GitHub)."
  reviewer: "Any organizer except the person who submitted it, or anyone who is part of that fact (e.g. the mentee)."
  decision: [approve, reject]
  reject_reasons:
    - "Proof link is broken or private"
    - "Proof does not belong to this member"
    - "Proof does not match the rule"
    - "Already counted (duplicate)"
    - "Over the rule's limit"
  review_within_days: 7
  appeal: "A rejected member can ask a second organizer to review once. The second decision is final."
  public: "Every submission, decision, reviewer and reason appears in the club log."
  fr:
    not_needed_for: "Les enregistrements (code de séance) et les contributions fusionnées dans les dépôts du club (détectées sur GitHub)."
    reviewer: "N'importe quel organisateur, sauf la personne qui a envoyé la preuve ou toute personne concernée (par ex. le mentoré)."
    reject_reasons:
      - "Lien cassé ou privé"
      - "La preuve n'appartient pas à ce membre"
      - "La preuve ne correspond pas à la règle"
      - "Déjà comptée (doublon)"
      - "Au-delà de la limite de la règle"
    appeal: "Un membre refusé peut demander un second avis à un autre organisateur, une seule fois. La seconde décision est définitive."
    public: "Chaque envoi, décision, vérificateur et motif apparaît dans le journal du club."

# --------------------------------------------------------------
# MULTIPLIERS
# --------------------------------------------------------------
multipliers:
  - id: double_event
    factor: 2
    applies_to: [attend, compete_enter, compete_place_solo, compete_place_team]
    trigger: "Event or session announced as double points BEFORE it starts (for a session: the check-in code is made with double points on)."
    trigger_fr: "Événement ou séance annoncé « points doubles » AVANT son début (pour une séance : le code de présence est créé avec les points doubles)."

# --------------------------------------------------------------
# RANKS (BANDANAS)
# A rank is reached when ALL its requirements are met.
# Ranks are never lost.
# --------------------------------------------------------------
ranks:
  - id: white
    name: "Hello World"
    bandana: "#f0f0f0"
    requires: { lifetime_points: 0, first_check_in: true }
  - id: yellow
    name: "Debugger"
    bandana: "#f9ab00"
    requires: { lifetime_points: 6 }
  - id: green
    name: "Builder"
    bandana: "#34a853"
    requires: { lifetime_points: 30, compete_enter: 1 }
  - id: blue
    name: "Shipper"
    bandana: "#4285f4"
    requires: { lifetime_points: 60, talk_or_workshop: 1 }
  - id: red
    name: "Mentor"
    bandana: "#ea4335"
    requires: { lifetime_points: 100, ship_project_or_workshop: 1 }
  - id: black
    name: "Ninja"
    bandana: "#2d2d2f"
    requires: { lifetime_points: 150, workshop: 1, mentoring: 5, seasons_active: 2 }

# --------------------------------------------------------------
# BADGES (shown on profiles, do not affect rank)
# --------------------------------------------------------------
badges:
  - { id: first_blood, name: "First Blood", requires: "1st place in any competition" }
  - { id: mic_drop,    name: "Mic Drop",    requires: "First talk or workshop" }
  - { id: on_fire,     name: "On Fire",     requires: "8 consecutive regular sessions" }
  - { id: sensei,      name: "Sensei",      requires: "5 confirmed mentoring sessions" }
  - { id: shipped_it,  name: "Shipped It",  requires: "First shipped project" }
  - { id: certified,   name: "Certified",   requires: "First certification" }
  - { id: founding,    name: "Founding Ninja", requires: "Checked in during the Fall 2026 season" }

# --------------------------------------------------------------
# NINJA ACCESSORIES (cosmetic only, never hide the bandana color)
# --------------------------------------------------------------
accessories:
  max_worn: 2                 # e.g. one hat + glasses
  free: [beanie, cap, party_hat, cat_ears, headphones, glasses, flower, mustache, beard]
  earned:
    - { id: shades, unlocked_by: "badge: first_blood", unlocked_by_fr: "Badge : First Blood" }
    - { id: halo,   unlocked_by: "badge: sensei", unlocked_by_fr: "Badge : Sensei" }
    - { id: crown,  unlocked_by: "Current Season Champion (most season points). Passes on at the start of each season.", unlocked_by_fr: "Champion de la saison en cours (le plus de points de la saison). Change de tête à chaque saison." }

# --------------------------------------------------------------
# INTEGRITY
# --------------------------------------------------------------
integrity:
  visibility: "All points, proofs and logs are visible to every signed-in member."
  self_scoring: "An organizer who took part in a competition cannot enter its results."
  edit_window_hours: 48
  after_lock: "Corrections after 48 hours are added as new log entries with a reason."
  errors: "A wrong result is treated as a bug: the rule or data is fixed and everyone's points are recomputed."
  organizers: "Organizers earn points under exactly the same rules as everyone else."

# French text for the integrity guarantees above (same order).
integrity_fr:
  visibility: "Tous les points, preuves et journaux sont visibles par chaque membre connecté."
  self_scoring: "Un organisateur qui a participé à une compétition ne peut pas en saisir les résultats."
  edit_window_hours: 48
  after_lock: "Après 48 heures, les corrections sont ajoutées comme nouvelles entrées du journal, avec un motif."
  errors: "Un résultat faux est traité comme un bug : on corrige la règle ou la donnée et on recalcule les points de tout le monde."
  organizers: "Les organisateurs gagnent des points selon exactement les mêmes règles que tout le monde."
