<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NOX · aivancity Tech Club</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050405">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #050405; --ink: #e8e3df; --dim: #8d8580; --red: #e1262c; --line: #2a2325; --team: #e1262c; --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--mono); -webkit-text-size-adjust: 100%; }
    body { min-height: 100dvh; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 64px; }
    h1, h2 { font-weight: 700; letter-spacing: .02em; margin: 0 0 12px; }
    h1 { font-size: 1.6rem; color: var(--red); text-shadow: 0 0 18px rgba(225, 38, 44, .45); }
    h2 { font-size: 1.15rem; }
    p { margin: 0 0 12px; }
    .dim { color: var(--dim); }
    .small { font-size: .85rem; }
    label { display: block; margin: 14px 0 6px; }
    input[type=text], select { width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink); background: #110d0e; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; }
    input[type=text]:focus, select:focus { outline: 2px solid var(--team); outline-offset: 1px; }
    .choice { display: flex; gap: 10px; }
    .choice label { flex: 1; margin: 0; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; }
    .choice input { position: absolute; opacity: 0; }
    .choice input:checked + span { color: var(--team); font-weight: 700; }
    .choice label:has(input:checked) { border-color: var(--team); }
    button { font: inherit; cursor: pointer; border-radius: 10px; padding: 12px 16px; border: 1.5px solid var(--line); background: #151012; color: var(--ink); }
    button.go { width: 100%; margin-top: 18px; background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; font-size: 1.05rem; }
    button:disabled { opacity: .5; cursor: default; }
    .card { border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; background: #0b0809; }
    .err { color: #ff6b70; min-height: 1.5em; margin-top: 8px; }
    .ok { color: #6fe39a; }
    .band { border-radius: 14px; padding: 18px 16px; margin: 0 0 14px; background: var(--team); color: #050405; }
    .band b { font-size: 1.5rem; display: block; letter-spacing: .04em; }
    .lv { display: flex; gap: 6px; margin: 8px 0 14px; }
    .lv i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
    .lv i.on { background: var(--team); }
    .reward { border-left: 3px solid var(--team); padding: 6px 10px; margin: 8px 0; background: #120e0f; white-space: pre-wrap; }
    .timer { font-size: 1.1rem; }
    ul.plain { list-style: none; padding: 0; margin: 6px 0; }
    ul.plain li { padding: 3px 0; }
    /* full-screen layers */
    .layer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    #reveal { background: #000; }
    #reveal .noise { font-size: 1rem; color: #3a3335; word-break: break-all; line-height: 1.1; max-height: 60vh; overflow: hidden; }
    #reveal.done { background: var(--team); color: #050405; }
    #reveal.done .big { font-size: clamp(2.4rem, 12vw, 4.5rem); font-weight: 800; letter-spacing: .06em; }
    #cue { background: #000; z-index: 90; }
    #cue.red { background: #b00008; animation: pulse .5s ease-in-out 3 alternate; }
    @keyframes pulse { from { background: #3a0003; } to { background: #d0000a; } }
    #cue .msg { color: var(--red); font-size: clamp(1.3rem, 6vw, 2.6rem); max-width: 22ch; text-shadow: 0 0 22px rgba(225, 38, 44, .6); }
    #cue.alarm { background: #000; animation: alarm .5s steps(2) infinite; }
    @keyframes alarm { 50% { background: #8a0006; } }
    #cue.alarm .msg { color: #fff; }
    .glitch { animation: glitch 1.2s infinite; }
    @keyframes glitch { 0%, 92%, 100% { transform: none; opacity: 1; } 93% { transform: translateX(-3px); opacity: .7; } 95% { transform: translateX(3px); } 97% { opacity: .4; } }
    /* host */
    .host main { max-width: 1100px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .row button { flex: 1 1 auto; }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
    textarea { width: 100%; font: inherit; color: var(--ink); background: #110d0e; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; }
    /* projector screen */
    .screen main { max-width: none; padding: 4vh 5vw; }
    .screen h1 { font-size: 5vh; }
    .screen .qr { background: #fff; padding: 2vh; border-radius: 2vh; width: 38vh; height: 38vh; }
    .screen .qr img { width: 100%; height: 100%; display: block; }
    .screen .split { display: flex; gap: 5vw; align-items: center; justify-content: center; flex-wrap: wrap; }
    .screen .counts { font-size: 3.4vh; }
    .screen table { font-size: 3.4vh; }
    .screen .url { font-size: 3vh; margin-top: 2vh; }
    #intro { background: #000; align-items: flex-start; justify-content: flex-end; padding: 6vh 6vw; text-align: left; }
    #intro pre { margin: 0; font: 3.2vh/1.45 var(--mono); color: #c9c2bd; white-space: pre-wrap; }
    #intro pre .n { color: var(--red); }
    .langbtn { position: fixed; top: 10px; right: 10px; z-index: 40; padding: 6px 10px; font-size: .8rem; }
    [hidden] { display: none !important; }
  </style>
  <script src="assets/i18n.js?v=20261113j"></script>
</head>
<body>
  <button type="button" class="langbtn" id="lang">FR</button>
  <main id="app"><p class="dim">…</p></main>

  <div class="layer" id="reveal" hidden><div class="noise" id="noise"></div><div id="revealText"></div></div>
  <div class="layer" id="cue" hidden><div class="msg" id="cueMsg"></div></div>
  <div class="layer" id="intro" hidden><pre id="introText"></pre></div>

  <script src="assets/platform/config.js?v=20261113j"></script>
  <script src="assets/platform/data.js?v=20261113j"></script>
  <script src="assets/nox-night.js?v=20261113j"></script>
</body>
</html>
