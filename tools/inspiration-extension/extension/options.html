<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Tech Club Inspiration</title>
<style>body{font:15px/1.4 system-ui,sans-serif;margin:0;padding:18px;min-width:320px;max-width:520px;color:#221d19;background:#fbf6ee}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 14px;color:#57504a}label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:9px 10px;border:2px solid #221d19;border-radius:10px;font:inherit;background:#fff}
button{margin-top:16px;padding:9px 18px;border:0;border-radius:999px;background:#2b3767;color:#fff;font:600 15px system-ui;cursor:pointer}
#s{margin-left:10px;color:#17708c;font-weight:600}</style></head>
<body><h1>Tech Club · Inspiration</h1>
<p>Ce que vous envoyez (enregistrement Instagram, clic droit sur une image, une vidéo, un lien, ou l’icône) part dans la bibliothèque d’inspiration du club.</p>
<label for="endpoint">Adresse du script du club</label><input id="endpoint" placeholder="https://script.google.com/macros/s/…/exec">
<label for="key">Clé du club</label><input id="key" type="password" autocomplete="off">
<label for="name">Votre prénom</label><input id="name" placeholder="ex. Victoria">
<button id="save">Enregistrer</button><span id="s" role="status"></span>
<script src="options.js"></script></body></html>
