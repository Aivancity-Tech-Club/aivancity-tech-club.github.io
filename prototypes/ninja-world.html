<meta charset="utf-8">
<title>Ninja World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&family=Google+Sans+Code:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-bleed animated world; a slim glass bar on top (brand + time of day), peak labels pinned to each summit. */
:root {
  --sky: #79b8f2;
  --ink: #1e1e1e;
  --glass: rgba(255, 255, 255, 0.88);
  --glass-dark: rgba(42, 45, 79, 0.9);
  --on-dark: #ffffff;
  --focus: #1a73e8;
  --display: "Google Sans", Figtree, system-ui, sans-serif;
  --mono: "Google Sans Code", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--display); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.bar { position: fixed; left: 16px; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; pointer-events: none; z-index: 3; }
.brand, .modes { pointer-events: auto; display: flex; align-items: center; gap: 10px;
  background: var(--glass); border: 2px solid var(--ink); border-radius: 999px; padding: 5px 14px 5px 5px; }
.brand b { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.brand span { font-family: var(--mono); font-size: 11px; }
.dot { width: 30px; height: 30px; border-radius: 50%; background: var(--glass-dark); display: grid; place-items: center;
  color: #55c9ea; font-family: var(--mono); font-weight: 700; font-size: 11px; }
.modes { padding: 4px; gap: 2px; flex-wrap: wrap; }
.modes button { font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); background: transparent; border: 0;
  border-radius: 999px; padding: 7px 12px; min-height: 34px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--on-dark); }
.modes button:focus-visible, .peak:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.modes .sep { width: 1px; height: 22px; background: var(--ink); opacity: .25; margin: 0 4px; }

.peak { position: fixed; left: 0; top: 0; white-space: nowrap; will-change: transform; z-index: 2;
  background: var(--glass); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px;
  padding: 4px 10px; font-size: 12px; font-weight: 800; text-decoration: none; display: flex; flex-direction: column; align-items: center; }
.peak small { font-family: var(--mono); font-size: 10px; font-weight: 400; }
.peak.black { background: var(--glass-dark); color: var(--on-dark); }
.hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 3;
  font-family: var(--mono); font-size: 12px; background: var(--glass); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px;
  transition: opacity 600ms ease; white-space: nowrap; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 14px; color: #fff; }
#fallback { position: fixed; inset: 0; }
#fallback img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 720px) {
  .peak { font-size: 10px; padding: 3px 7px; border-radius: 10px; }
  .peak small, .brand span { display: none; }
  .modes button { padding: 6px 9px; font-size: 12px; }
}
</style>

<div id="stage" aria-label="Animated world with six mountains, one for each bandana rank, beside a lake" role="img"></div>
<div id="fallback" hidden></div>
<div class="loading" id="loading">painting the world…</div>

<div class="bar">
  <div class="brand"><div class="dot">&lt;/&gt;</div><b>Ninja World</b><span id="clockLabel">prototype</span></div>
  <div class="modes" role="group" aria-label="Time of day">
    <button type="button" data-mode="auto" aria-pressed="true">Auto</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" data-mode="dawn" aria-pressed="false">Dawn</button>
    <button type="button" data-mode="day" aria-pressed="false">Day</button>
    <button type="button" data-mode="evening" aria-pressed="false">Evening</button>
    <button type="button" data-mode="night" aria-pressed="false">Night</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="motionBtn" aria-pressed="true">Motion</button>
  </div>
</div>
<div id="labels"></div>
<div class="hint" id="hint">move your cursor or drag to look around · keep an eye on the lake</div>

/* ---------------- helpers ---------------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const live = Math.random;  // events use true randomness so every visit is different
const lrand = (a, b) => a + (b - a) * live();
const rgb = (c) => (Math.round(c[0]) << 16) + (Math.round(c[1]) << 8) + Math.round(c[2]);
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const easeInOut = (p) => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

async function svgTexture(str, scale = 1) {
  const img = await svgImage(str); const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);

}
function noiseField(size, freq, octaves, seed) {
  const r = rng(seed), out = new Float32Array(size * size); let amp = 1, total = 0;
  for (let o = 0; o < octaves; o++) {
    const g = freq * (1 << o), lat = new Float32Array(g * g).map(() => r());
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const fx = x / size * g, fy = y / size * g, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      const a = lat[(y0 % g) * g + (x0 % g)], b = lat[(y0 % g) * g + ((x0 + 1) % g)], c = lat[((y0 + 1) % g) * g + (x0 % g)], d = lat[((y0 + 1) % g) * g + ((x0 + 1) % g)];

}

      boat.y = y + Math.sin(t * 1.5) * 1.3; boat.rotation = Math.sin(t * 1.2) * 0.02;
      if (oar) oar.rotation = -0.25 + Math.sin(t * 2.2) * 0.38;
      if (glow) glow.alpha = 0.75 + 0.25 * Math.sin(t * 7) * Math.sin(t * 3.1);
      rboat.x = boat.x; rboat.rotation = -boat.rotation;
      if (rglow) { rglow.x = boat.x + (isRaft ? 60 : 58) * 0.55 * s * dir; rglow.y = y + 30 * s; rglow.alpha = glow.alpha * 0.6; }
      if (t - lastWake > 0.5) { lastWake = t; const w = sprite(ringTex, waterLife, boat.x - dir * 50 * s, y + 6, 0.5, 0.5, 0.25 * s); w.t0 = t; wakes.push(w); }
      for (let i = wakes.length - 1; i >= 0; i--) { const w = wakes[i], a = (t - w.t0) / 3.5; w.scale.set((0.25 + a * 0.9) * s, (0.12 + a * 0.25) * s * 0.6); w.alpha = (1 - a) * 0.45 * (0.6 + stroke * 0.4); if (a >= 1) { w.destroy(); wakes.splice(i, 1); } }
      if (p >= 1) { boat.destroy({ children: true }); rboat.destroy(); rglow && rglow.destroy(); wakes.forEach(w => w.destroy()); boatActive = false; return false; }
      return true; } });
  }

  function birds() {
    const n = 4 + Math.floor(live() * 5), dir = live() < 0.5 ? 1 : -1, y = lrand(110, 300), sp = lrand(55, 85) * dir;
    const flock = [];
    for (let i = 0; i < n; i++) { const b = sprite(tex.bird, birdsL, (dir > 0 ? -60 : W + 60) - dir * (Math.abs(i - n / 2) * 26), y + Math.abs(i - n / 2) * 14 + lrand(-6, 6), 0.5, 0.5, lrand(0.42, 0.6)); b.s = b.scale.x; b.ph = lrand(0, 6); flock.push(b); }
    const t0 = now();
    events.push({ update() {
      const t = now() - t0;
      for (const b of flock) { b.x += sp / 60; b.y += Math.sin(t * 1.3 + b.ph) * 0.15; b.scale.y = b.s * (0.25 + 0.75 * Math.abs(Math.sin(t * 6 + b.ph))); }
      if (t > (W + 400) / Math.abs(sp)) { flock.forEach(b => b.destroy()); return false; } return true; } });
  }

  function shootingStar() {
    const s = sprite(streakTex, starsL, lrand(200, W - 400), lrand(40, 200), 1, 0.5, 1); s.scale.set(2.4, 1.2); s.rotation = lrand(0.25, 0.5); s.blendMode = PIXI.BLEND_MODES.ADD;
    const t0 = now(), vx = Math.cos(s.rotation) * 900, vy = Math.sin(s.rotation) * 900;
    events.push({ update() { const t = now() - t0; s.x += vx / 60; s.y += vy / 60; s.alpha = clamp01(1 - t / 0.9); if (t > 0.9) { s.destroy(); return false; } return true; } });
  }

  function pickEvent() {
    const night = mode === 'night', table = [['fish', 5], ['mermaid', night || mode === 'dawn' ? 1.1 : 0.6]];
    if (!night) table.push(['birds', 2.2]);
    if (!boatActive) table.push(['vessel', night ? 1.2 : 2]);
    if (night) table.push(['star', 2.5]);
    const total = table.reduce((a, b) => a + b[1], 0); let r = live() * total;
    for (const [name, w] of table) { if ((r -= w) <= 0) return name; } return 'fish';
  }
  const RUN = { fish: fishJump, mermaid, vessel, birds, star: shootingStar };
  // keyboard shortcut for reviewers: press 1-5 to summon a sighting
  window.addEventListener('keydown', (e) => { const k = { '1': 'fish', '2': 'mermaid', '3': 'vessel', '4': 'birds', '5': 'star' }[e.key]; if (k && !(k === 'vessel' && boatActive)) RUN[k](); });

  /* ---------------- animate ---------------- */
  let t = 0, frame = 0, petalTimer = 2;
  const pt = new PIXI.Point();
  app.ticker.add((dt) => {
    const step = motion ? dt : 0; t += step / 60; frame++;
    blendLook(Math.min(1, 0.022 * dt)); applyLook();

    const idle = performance.now() - lastInput > 3000;
    const gx = idle ? Math.sin(t * (portrait ? 0.07 : 0.13)) * (portrait ? 0.95 : 0.55) : (portrait ? -tx : tx), gy = idle ? Math.sin(t * 0.09) * 0.25 : ty;
    const k = motion ? 0.045 : 1; cx += (gx - cx) * k; cy += (gy - cy) * k;
    world.x = -overflowX / 2 - cx * overflowX / 2;
    for (const c of parallax) { c.x = -cx * 46 * c.depth; c.y = -cy * 16 * c.depth; }

    if (motion) {
      for (const s of stars) s.alpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp * 2 + s.ph));
      for (const r of rays) { r.rotation = r.base + Math.sin(t * 0.2 + r.ph) * 0.04; r.alpha = cur.rays * (0.6 + 0.4 * Math.sin(t * 0.5 + r.ph)); }
      for (const c of clouds) { c.x += c.sp * step; if (c.x > W + 300) c.x = -300; c.alpha = c.baseA * (mode === 'night' ? 0.55 : 1); }
      for (const m of mists) m.tilePosition.x += m.sp * step;
      for (const n of ninjas) n.y = n.by + Math.sin(t * 2.2 + n.ph) * 2.2;
      dispSprite.x += 0.55 * step; dispSprite.y += 0.18 * step;
      const sunX = cur.sun[0];
      for (const g of glints) { if (g.near) g.x = sunX + g.off; else { g.x += g.vx * step * 0.3; if (g.x > W + 60) g.x = -60; }
        g.alpha = cur.glint * g.base * 2 * (0.5 + 0.5 * Math.sin(t * g.sp * 2 + g.ph)) * (g.near ? 1 : 0.6); }
      for (const s of sway) s.skew.x = Math.sin(t * 1.3 + s.ph + s.x * 0.004) * s.amp;
      for (const f of flies) { f.x = f.bx + Math.sin(t * f.sp + f.ph) * 40 + Math.sin(t * f.sp * 2.3) * 12; f.y = f.by + Math.cos(t * f.sp * 0.8 + f.ph) * 22; f.alpha = cur.flies * Math.max(0, Math.sin(t * f.sp * 3 + f.ph)); }
      // petals fall now and then from the cherry trees, in small gusts
      petalTimer -= step / 60;
      if (petalTimer <= 0 && petals.length < 22) { const n = live() < 0.3 ? 4 : 1; for (let i = 0; i < n; i++) spawnPetal(); petalTimer = lrand(0.8, 3.5) / Math.max(0.2, cur.petals); }
      for (let i = petals.length - 1; i >= 0; i--) {
        const p = petals[i]; p.life += step / 60;
        p.x += (p.vx + Math.sin(t * 0.7) * 0.25) * step; p.y += (p.vy + Math.sin(t * 2 + p.ph) * 0.35) * step;
        p.rotation += p.spin * step; p.scale.x = p.s * Math.cos(t * 2.4 + p.ph); p.alpha = clamp01(Math.min(p.life / 0.6, (12 - p.life) / 2));
        if (p.y > 900 || p.x > W + 40 || p.life > 12) { p.destroy(); petals.splice(i, 1); }
      }
      grain.tilePosition.set((frame * 37) % 256, (frame * 53) % 256);
      // sightings
      if (now() > nextEvent) { RUN[pickEvent()](); scheduleNext(); }
      for (let i = events.length - 1; i >= 0; i--) if (!events[i].update()) events.splice(i, 1);
    }
    if (frame % 2 === 0 || !motion) app.renderer.render(scene, { renderTexture: rt, clear: true });

    // labels: whole pixels, no CSS easing, so they glide with their peak instead of trembling
    const yMin = (window.innerWidth < 720 ? 128 : 96);
    for (const l of labels) {
      pt.set(l.p.x, l.p.y - 50); const g = l.parent.toGlobal(pt);
      const x = Math.round(g.x - l.w / 2), y = Math.round(Math.max(g.y, yMin + l.h) - l.h);
      l.el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    }
  });
})();
})();
</script>
