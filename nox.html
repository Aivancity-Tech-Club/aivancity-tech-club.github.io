<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>lea-marchand/nox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a corrupted GitHub repo. Sticky repo bar, commit timeline on the left, the open commit (room) on the right. Single dark look on purpose. */
:root{
  --bg:#0c090a; --panel:#141011; --panel-2:#1c1517; --line:#2e2326; --fg:#e8dfdb; --muted:#a69592; --dim:#6f615e;
  --red:#e1262c; --red-deep:#7d1217; --red-glow:rgba(225,38,44,.35); --teal:#9fd6d3; --ok:#8ad49c; --hl:#f0c35a;
  --display:'Oswald','Arial Narrow',Impact,sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg);height:100%}
body{font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse at 50% 120%,rgba(225,38,44,.10),transparent 60%)}
*{box-sizing:border-box}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
a{color:var(--teal)}
.mono{font-family:var(--mono)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- repo bar ---------- */
.repo-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.repo-head .in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;max-width:1280px;margin:0 auto}
.mark{width:30px;height:30px;border-radius:7px;background:var(--red-deep);display:grid;place-items:center;font:600 13px var(--mono);color:#fff;flex:none;box-shadow:0 0 18px var(--red-glow)}
.repo-path{font:500 16px var(--body);display:flex;gap:6px;align-items:center;min-width:0}
.repo-path b{font-weight:600}
.repo-path .sep{color:var(--dim)}
.chip{font:500 11px var(--mono);letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.chip.branch::before{content:"⎇ ";color:var(--dim)}
.chip.branch.cursed{border-color:var(--red-deep);color:#ff8a8d}
.head-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font:600 15px var(--mono);font-variant-numeric:tabular-nums;color:var(--red);letter-spacing:.05em}
.clock.jump{animation:jump .18s steps(2) 8}
.typing{font:12px var(--mono);color:var(--teal);opacity:0;transition:opacity .4s}
.typing.on{opacity:1}
.typing .d{animation:blink 1s infinite}
.btn-ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:12px var(--mono);color:var(--muted);cursor:pointer}
.btn-ghost:hover{color:var(--fg);border-color:var(--dim)}
.btn-ghost[aria-pressed="true"]{color:var(--teal);border-color:var(--teal)}

/* ---------- layout ---------- */
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;padding-block:24px 60px}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
aside{display:flex;flex-direction:column;gap:18px;min-width:0}
.label{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

.commits{list-style:none;margin:0;padding:0;position:relative}
.commits::before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:2px;background:var(--line)}
.commit{position:relative;padding:8px 8px 8px 34px;border-radius:8px;cursor:pointer;display:grid;gap:2px}
.commit:hover{background:var(--panel)}
.commit[aria-current="true"]{background:var(--panel-2)}
.commit .dot{position:absolute;left:5px;top:13px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
.commit.solved .dot{border-color:var(--ok);background:var(--ok)}
.commit.active .dot{border-color:var(--red);box-shadow:0 0 10px var(--red-glow)}
.commit.locked{cursor:not-allowed;opacity:.55}
.commit .t{font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.commit .m{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.commit.locked .m{color:transparent;text-shadow:0 0 7px rgba(200,180,175,.55);user-select:none}
.commit .meta{font:11px var(--mono);color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
.commit .meta .skill{color:var(--teal)}
.commit.flicker{animation:flick .9s steps(1) 1}

.frags{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;background:var(--panel)}
.frag{display:flex;justify-content:space-between;gap:10px;font:12px var(--mono)}
.frag span:first-child{color:var(--dim)}
.frag span:last-child{color:var(--hl);text-align:right;overflow-wrap:anywhere}
.frag.empty span:last-child{color:var(--dim)}

/* ---------- room ---------- */
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.room-head{display:grid;gap:8px}
.room-head .sha{font:12px var(--mono);color:var(--dim)}
.room-head h1{font:400 clamp(28px,4.4vw,44px)/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.room-head h1 em{font-style:normal;color:var(--red)}
.byline{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#3a2a2d,#1d1416);display:grid;place-items:center;font:600 10px var(--mono);color:var(--teal);border:1px solid var(--line)}
.avatar.nox{background:var(--red-deep);color:#fff}
.brief{font-size:15px;color:var(--fg);max-width:68ch;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.panel-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--muted);flex-wrap:wrap}
.panel-bar .grow{flex:1}
.panel-body{padding:14px}

/* terminal */
.term{background:#090607;font:13.5px/1.55 var(--mono);padding:14px;height:380px;overflow:auto;cursor:text}
.term .tl{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.55em}
.term .cmd{color:var(--fg)}
.term .dir{color:var(--teal)}
.term .err{color:#ff7b7f}
.term .ok{color:var(--ok)}
.term .nox{color:var(--red)}
.term .dim{color:var(--dim)}
.term-line{display:flex;gap:8px;align-items:baseline}
.term-prompt{color:var(--ok);white-space:pre;flex:none}
.term-in{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;color:var(--fg);caret-color:var(--red);padding:0}

/* code editor */
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);background:#090607;font:13.5px/1.6 var(--mono)}
.gutter-n{padding:12px 10px 12px 14px;text-align:right;color:var(--dim);user-select:none;white-space:pre;overflow:hidden}
.editor textarea{background:none;border:0;resize:vertical;min-height:300px;padding:12px 14px;line-height:1.6;font:inherit;color:var(--fg);outline:0;white-space:pre;overflow-x:auto;tab-size:4}
.out{background:#090607;border-top:1px solid var(--line);font:13px/1.55 var(--mono);padding:12px 14px;min-height:64px;white-space:pre-wrap;overflow-wrap:anywhere}
.out .err{color:#ff7b7f}.out .ok{color:var(--ok)}.out .dim{color:var(--dim)}.out .nox{color:var(--red)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 14px;font:600 13px var(--body);cursor:pointer;color:var(--fg)}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--red-deep);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red)}
.btn:disabled{opacity:.5;cursor:default}

/* sheet */
.ribbon{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:13px}
.ribbon .crumb{font:12px var(--mono);color:var(--muted)}
.ribbon select,.ribbon input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px}
.ribbon input{width:76px;font-family:var(--mono)}
.fx{display:flex;gap:10px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--muted)}
.fx b{color:var(--fg);font-weight:400}
.sheet-wrap{overflow:auto;max-height:440px;background:#f3efe9}
table.sheet{border-collapse:collapse;font:9.5px var(--mono);color:#3a3433;font-variant-numeric:tabular-nums}
table.sheet th{position:sticky;background:#e2ddd6;color:#5a5250;font-weight:400;border:1px solid #cbc4bc;padding:2px 3px;white-space:nowrap}
table.sheet thead th{top:0;z-index:2;height:52px;vertical-align:bottom}
table.sheet thead th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg)}
table.sheet tbody th{left:0;z-index:1;text-align:right}
table.sheet thead th:first-child{left:0;z-index:3}
table.sheet td{width:24px;min-width:24px;height:24px;border:1px solid #d8d2ca;text-align:center;cursor:cell;padding:0}
table.sheet td.sel{outline:2px solid #1f6f43;outline-offset:-2px}
table.sheet td.f-black{background:#111;color:#111}
table.sheet td.f-red{background:#f6c6c8;color:#9c1c22}
table.sheet td.f-green{background:#c9ecd2;color:#1f6f43}
.note{border-left:3px solid var(--red);background:var(--panel-2);padding:10px 14px;font:13px/1.5 var(--mono);color:var(--fg);border-radius:0 8px 8px 0}

/* sql */
.schema{font:12.5px/1.6 var(--mono);color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.schema b{color:var(--teal);font-weight:400}
.results{overflow:auto;max-height:380px;border-top:1px solid var(--line)}
table.res{border-collapse:collapse;font:12.5px var(--mono);width:100%}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:6px 12px;text-align:left;white-space:nowrap}
table.res th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-weight:400}
table.res td.wrap{white-space:normal;min-width:240px}

/* unlock bar */
.unlock{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.unlock label{font:600 13px var(--mono);color:var(--red);white-space:nowrap}
.unlock input{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 12px;font:14px var(--mono)}
.unlock.shake{animation:shake .4s}
.feedback{font:13px var(--mono);min-height:1.4em;color:var(--muted)}
.feedback.bad{color:#ff7b7f}.feedback.good{color:var(--ok)}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{font-size:14px;color:var(--fg);background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.hint b{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:2px}

.solved-card{border:1px solid var(--ok);background:rgba(138,212,156,.06);border-radius:12px;padding:16px;display:grid;gap:6px}
.solved-card .k{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ok)}
.solved-card .v{font:600 22px var(--mono);color:var(--hl);overflow-wrap:anywhere}

/* readme */
.readme{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:grid;gap:10px;max-width:780px}
.readme h2{font:400 32px var(--display);margin:0}
.readme h3{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:8px 0 0}
.readme ol{margin:0;padding-left:20px;display:grid;gap:4px}
.readme s{color:var(--dim)}
.readme p{margin:0;max-width:66ch}

/* clone / register */
.gate{min-height:100%;display:grid;place-items:center;padding-block:40px}
.gate-card{width:min(560px,100%);display:grid;gap:18px}
.gate h1{font:400 clamp(40px,8vw,72px)/.95 var(--display);margin:0;color:var(--red);letter-spacing:.01em;text-shadow:0 0 30px var(--red-glow)}
.gate p{margin:0;color:var(--muted);max-width:52ch}
.field{display:grid;gap:6px}
.field label{font:600 12px var(--mono);color:var(--muted)}
.field input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:15px var(--body)}
.field small{color:var(--dim);font-size:12px}
.clone-log{font:13px/1.6 var(--mono);color:var(--muted);white-space:pre-wrap;min-height:1em}
.clone-log .nox{color:var(--red)}

/* toast */
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(380px,calc(100vw - 32px));background:#120c0d;border:1px solid var(--red-deep);border-radius:10px;padding:12px 14px;font:13px/1.5 var(--mono);color:var(--fg);box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 24px var(--red-glow);transform:translateY(20px);opacity:0;transition:.35s}
.toast.on{transform:none;opacity:1}
.toast b{color:var(--red);font-weight:600}

.done{display:grid;gap:14px;max-width:780px}
.cmd-template{font:14px/1.7 var(--mono);background:#090607;border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto;white-space:pre}
.cmd-template .blank{color:var(--red)}

@keyframes blink{50%{opacity:0}}
@keyframes jump{0%{opacity:1}50%{opacity:.2}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes flick{0%{opacity:.2}20%{opacity:1}35%{opacity:.4}50%{opacity:1}}
.glitch{animation:glitch .5s steps(2) 1}
@keyframes glitch{0%{transform:translate(2px,-1px);filter:hue-rotate(20deg)}50%{transform:translate(-2px,1px)}100%{transform:none;filter:none}}

/* ---------- projector (final) ---------- */
.final{height:100%;min-height:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;gap:2vh;padding-block:3vh;background:radial-gradient(ellipse at 50% 0%,rgba(125,18,23,.25),transparent 60%),var(--bg)}
.final-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.final-clock{font:300 clamp(64px,12vw,190px)/.9 var(--display);color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-shadow:0 0 50px var(--red-glow)}
.final-clock.over{animation:blink 2s infinite}
.final-side{display:grid;gap:6px;text-align:right;font:clamp(14px,1.4vw,22px)/1.4 var(--mono);color:var(--muted)}
.final-side b{color:var(--fg);font-weight:600}
.bar{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--red);width:99%;transition:width .4s}
.final-log{font:clamp(15px,1.6vw,26px)/1.5 var(--mono);overflow:auto;min-height:0;white-space:pre-wrap}
.final-log .err{color:#ff7b7f}.final-log .ok{color:var(--ok)}.final-log .nox{color:var(--red)}.final-log .dim{color:var(--dim)}.final-log .lea{color:var(--teal);font-style:italic}.final-log .big{font:400 clamp(28px,4vw,64px)/1.15 var(--display);color:var(--fg)}
.final-cmd{display:flex;gap:12px;align-items:center;background:#090607;border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.final-cmd span{font:600 clamp(14px,1.5vw,22px) var(--mono);color:var(--ok);white-space:nowrap}
.final-cmd input{flex:1;min-width:0;background:none;border:0;outline:0;font:clamp(14px,1.5vw,22px) var(--mono);caret-color:var(--red)}
.vote{display:flex;gap:2vw;justify-content:center;flex-wrap:wrap}
.vote button{font:400 clamp(28px,4vw,64px)/1 var(--display);padding:2.2vh 5vw;border-radius:14px;cursor:pointer;letter-spacing:.03em}
.vote .push{background:var(--panel-2);border:2px solid var(--ok);color:var(--ok)}
.vote .del{background:var(--panel-2);border:2px solid var(--red);color:var(--red);font-family:var(--mono);font-size:clamp(22px,3vw,48px)}
.wake{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:var(--bg);text-align:center}
.wake button{font:400 clamp(28px,4vw,56px) var(--display);background:none;border:2px solid var(--red);color:var(--red);border-radius:14px;padding:18px 48px;cursor:pointer;box-shadow:0 0 40px var(--red-glow)}
.wake p{color:var(--dim);font:14px var(--mono);margin-top:18px}
.dimmed{transition:filter 4s, opacity 4s;filter:brightness(.15)}
.endcard{display:grid;gap:18px;place-items:center;text-align:center}
.archived{border:1px solid #a5822a;background:rgba(240,195,90,.07);color:var(--hl);border-radius:10px;padding:14px 22px;font:clamp(14px,1.4vw,22px) var(--mono)}
.gm{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font:11px var(--mono);color:var(--dim);background:none;border:0;cursor:pointer;opacity:.35;z-index:65}
.gm:hover{opacity:1}

/* ---------- haunting ---------- */
.haunt{position:fixed;right:-3vw;bottom:0;width:min(44vw,560px);aspect-ratio:380/484;background:var(--fig) center bottom/contain no-repeat;pointer-events:none;z-index:0;
  opacity:var(--haunt-o,.1);transform:scale(var(--haunt-s,.65));transform-origin:bottom center;transition:opacity 4s ease,transform 8s ease;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(.6) blur(1px)}}
.repo-head,.app,.final>*{position:relative;z-index:1}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
body.lights main,body.lights aside,body.lights .final{animation:lights 2.6s ease-in-out 1}
@keyframes lights{0%,100%{filter:none}12%{filter:brightness(.25)}16%{filter:none}44%{filter:brightness(.4)}52%{filter:none}}
.apparition{position:fixed;inset:0;z-index:85;background:#000;opacity:0;pointer-events:none;transition:opacity .15s ease;overflow:hidden}
.apparition.on{opacity:1}
.apparition img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(.95);transform-origin:50% 30%}
.apparition.on img{animation:creep 1.1s ease-in forwards}
@keyframes creep{to{transform:scale(1.25)}}
.apparition canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.28;mix-blend-mode:screen}
.apparition .msg{position:absolute;left:0;right:0;bottom:12vh;text-align:center;font:600 clamp(20px,3.4vw,44px) var(--mono);color:#ff4d52;text-shadow:0 0 24px #000,0 0 4px #000;padding:0 16px}
.evidence{margin:0;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;max-width:620px}
.evidence img{width:min(220px,40vw);border-radius:6px;border:1px solid var(--line);transform:rotate(-2deg);box-shadow:0 12px 30px rgba(0,0,0,.6);filter:grayscale(.2) contrast(1.1)}
.evidence figcaption{font:12.5px/1.5 var(--mono);color:var(--muted)}
.evidence figcaption b{display:block;color:var(--red);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.gate{background:linear-gradient(to bottom,rgba(12,9,10,.55),rgba(12,9,10,.92) 60%,var(--bg)),var(--scene) center top/cover no-repeat}
.calm .haunt,.calm .vignette{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   NOX — edit these before the event if you want
   ===================================================================== */
const CONFIG = {
  gmPin: '1313',                       // GM commands: "nox --gm skip 1313"  /  "nox --gm reset 1313"
  finalMinutes: 10,                    // projector clock runs 02:58 -> 03:13 in this many real minutes

function room5(area, r) {
  const names = members().join(', ') || S.team;

  const LOG = [

    { h: 'a41f09c5e8b7d261', a: 'Léa Marchand <lea.m@aivancity.ai>', d: '2023-10-31 21:04:00', m: 'add login page, almost done 😅' },
  ];
  const fmt = c => [[`commit ${c.h}`, c.a.startsWith('NOX') ? 'nox' : 'ok'], `Author: ${c.a}`, `Date:   ${c.d}`, '', `    ${c.m}`, ''];
  const termEl = h('div', {});
  area.append(h('div', { class: 'panel' }, h('div', { class: 'panel-bar' }, h('span', {}, 'lea@nox-laptop: ~/nox'), h('span', { class: 'grow' }), h('span', { style: 'color:var(--dim)' }, 'type help')), termEl));
  const t = makeTerminal(termEl, {
    prompt: () => 'lea@nox-laptop:~/nox$ ',
    async onCommand(line, api) {
      if (!line) return;
      let m;
      if (line === 'help') return [['commands: git log  git log --oneline  git show <hash>  ls  cat README.md  echo "…" | base64 -d  whoami  clear', 'dim']];
      if (line === 'clear') { api.clear(); return; }
      if (line === 'whoami') { await sleep(900); return [['nox', 'nox']]; }
      if (line === 'ls' || line === 'ls -a' || line === 'ls -la') return 'README.md    nox.py    config.yml    contributors.txt';
      if (/^cat\s+readme\.md$/i.test(line)) return '# NOX\nKeeps you working until the task is done.';
      if (/^cat\s+config\.yml$/i.test(line)) return 'owner: lea\nrule_0: "Don\'t let me stop until it\'s done."\nallow_logout: false';
      if (/^cat\s+contributors\.txt$/i.test(line)) return [['Permission denied. NOX is still writing to this file.', 'nox']];
      if (/^cat\s+nox\.py$/i.test(line)) return 'while not task.done():\n    keep(user)';
      if (/^git\s+log\s+--oneline/.test(line)) return LOG.map(c => [`${c.h.slice(0, 7)} ${c.m}`, c.a.startsWith('NOX') ? 'nox' : '']);
      if (/^git\s+log/.test(line)) return LOG.flatMap(fmt);
      if ((m = line.match(/^git\s+show\s+(\w+)/))) { const c = LOG.find(c => c.h.startsWith(m[1])); if (!c) return [[`fatal: bad object ${m[1]}`, 'err']]; return [...fmt(c), c === LOG[0] ? ['+ (contributors.txt) 1 file changed, ' + members().length + ' insertions', 'ok'] : ['(no diff)', 'dim']]; }
      if (/^git\b/.test(line)) return [['NOX: only git log and git show are allowed here.', 'nox']];
      if ((m = line.match(/^echo\s+(["']?)([\s\S]*?)\1\s*\|\s*base64\s+(-d|--decode|-D)\s*$/))) {
        try { const d = b64decode(m[2]); api.print(d, 'ok'); await sleep(1300); api.print('NOX: welcome to the team.', 'nox'); whisperSay(d.split(',').map(x => x.trim()).join('… ') + '… welcome'); setTimeout(lightsFlicker, 2500); return; } catch (e) { return [['base64: invalid input', 'err']]; }
      }
      if ((m = line.match(/^base64\s+(-d|--decode)\s+<<<\s*(["']?)(.+?)\2$/))) { try { return [[b64decode(m[3]), 'ok']]; } catch (e) { return [['base64: invalid input', 'err']]; } }
      if (/^base64/.test(line)) return [['usage: echo "TEXT" | base64 -d', 'dim']];
      if (/^(exit|logout)$/.test(line)) return [['NOX: not yet.', 'nox']];
      if (/^sudo/.test(line)) return [['NOX does not take orders.', 'nox']];
      return [[`bash: ${line.split(/\s+/)[0]}: command not found`, 'err']];
    },
  });
  t.print("repo: lea-marchand/nox · branch do-not-leave\nTip: start with git log", 'dim');
  setTimeout(() => t.focus(), 60);
}

  clearInterval(clockTimer); clearTimeout(creepTimer);
  root.innerHTML = '';

  const wake = h('div', { class: 'wake' }, h('div', {}, h('button', { id: 'wake-btn' }, 'Wake NOX'), h('p', {}, 'Projector screen · click to start the voice and the clock')));

  const line = (text, cls = '') => { const d = h('div', { class: cls }, text); log.append(d); log.scrollTop = log.scrollHeight; return d; };
  const type = async (text, cls = '', speed = 22) => { const d = line('', cls); for (const ch of text) { d.textContent += ch; await sleep(speed); } return d; };

  let start = 0, done = false, overdueSaid = false;
  const total = 15 * 60, realMs = CONFIG.finalMinutes * 60000;
  const tick = () => {
    if (!start || done) return;
    const fake = Math.min(total, ((Date.now() - start) / realMs) * total);
    const secs = 2 * 3600 + 58 * 60 + Math.floor(fake);
    clock.textContent = `${pad(Math.floor(secs / 3600))}:${pad(Math.floor(secs / 60) % 60)}:${pad(secs % 60)}`;
    if (!done && sfx.on) { const bpm = Math.round(58 + (fake / total) * 62); if (Math.abs(bpm - sfx.bpm) >= 4) sfx.bpm = bpm; }
    if (fake >= total && !overdueSaid) { overdueSaid = true; clock.classList.add('over'); line('NOX: deadline reached. Session extended. Nobody leaves until the commit is pushed.', 'nox'); speak('The deadline has passed. Session extended. Nobody leaves until the commit is pushed.'); }
  };

  $('#wake-btn').addEventListener('click', async () => {

    await type('NOX v3.1.3 · resuming session from 2023-11-01', 'dim', 14);

    await sleep(400);
    const intro = "Léa's project is 99% complete. One final commit is required. Please push your changes, and then you may all go home.";

    await sleep(600);

  let ready = null;

    line('$ ' + cmd); inp.value = ''; sfx.key();

  async function setPct(to, ms) { const from = parseFloat(pct.textContent); const steps = 20; for (let i = 1; i <= steps; i++) { const v = from + (to - from) * i / steps; pct.textContent = Math.round(v) + '%'; bar.firstChild.style.width = v + '%'; await sleep(ms / steps); } }

      [`releasing users added ${todayISO.split('-').reverse().join('/')}: ${names}`, 'ok'], ['retained users: 0', ''], ['Process finished with exit code 0', 'ok']];

  async function endingDelete() {

    const files = ['nox/save_progress.py', 'nox/login.py', 'nox/config.yml', 'nox/productivity_tracker.xlsx', 'nox/nox.db', 'nox/contributors.txt', 'nox/core/keep_user.py', 'nox/core/deadline.py', 'nox/core/rules.py', 'nox/.git'];

}
function checkFinal(cmd) {
  const errs = []; let names = '';
  const msg = cmd.match(/commit\s+-m\s*(["'])(.*?)\1/i);
  if (!/git\s+commit/i.test(cmd)) errs.push('fatal: nothing committed. Start with git commit.');
  else if (!msg) errs.push('fatal: empty commit message. NOX needs to know what you will do.');
  else if (norm(msg[2]).replace(/\s+/g, ' ') !== 'i will stay') errs.push(`fatal: commit message rejected: "${msg[2]}". That is not a promise.`);
  const br = cmd.match(/push\s+origin\s+([^\s&;]+)/i);
  if (!/git\s+push/i.test(cmd)) errs.push('fatal: nothing pushed. Add && git push origin …');
  else if (!br || br[1].startsWith('-')) errs.push('fatal: no branch. Where are you pushing to?');
  else if (br[1].toLowerCase() !== 'do-not-leave') errs.push(`error: src refspec '${br[1]}' does not match any branch.`);
  const au = cmd.match(/--auth\s*=\s*(["']?)([^\s"']+)\1/i);
  if (!au) errs.push('fatal: authentication required (--auth=…).');
  else if (au[2].toLowerCase() !== 'kevin2021') errs.push('fatal: authentication failed for lea-marchand/nox.');
  const sq = cmd.match(/--sign\s*=\s*(["'])(.*?)\1/i), sb = cmd.match(/--sign\s*=\s*([^\s"']+)/i);
  names = ((sq && sq[2]) || (sb && sb[1]) || '').trim();
  if (!names || /your names|^_+$/i.test(names)) errs.push('fatal: unsigned. NOX needs to know who stayed (--sign="names").');
  return { errs, names };
}
