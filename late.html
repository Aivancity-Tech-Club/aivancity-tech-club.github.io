<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NOX · En retard ? · aivancity Tech Club</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050405">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { --c: #e1262c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #050405; color: #e8e3df; font: 17px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    main { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px 16px; }
    .nox { color: #e1262c; letter-spacing: .4em; font-size: .85rem; margin: 0 0 18px; }
    .room { font-size: clamp(2.6rem, 14vw, 5rem); font-weight: 800; letter-spacing: .05em; color: var(--c); margin: 6px 0; text-shadow: 0 0 24px color-mix(in srgb, var(--c) 50%, transparent); }
    .band { width: min(420px, 100%); height: 10px; border-radius: 5px; background: var(--c); margin: 14px 0 22px; }
    p { margin: 6px 0; max-width: 34ch; }
    .dim { color: #8d8580; font-size: .9rem; }
  </style>
</head>
<body>
  <main id="m"><p class="nox">NOX</p><p class="dim">…</p></main>
  <script src="assets/platform/config.js?v=20261112e"></script>
  <script>
  /* /late: someone arriving late gets a room straight away. Latecomers are spread evenly over the four rooms
     (the on-time teams are already equal, drawn from the box). Uses the game's player list (night/nox2026/players),
     with an anonymous sign-in on a separate Firebase app, so the same phone always sees the same room. */
  (function () {
    const ROOMS = [   // team id in the database → room
      { id: 'ravens', room: 'AURORA', color: '#3ad66b' },
      { id: 'bats', room: 'STORM', color: '#38a0f0' },
      { id: 'ghosts', room: 'ETHOS', color: '#a259ff' },
      { id: 'spiders', room: 'SINGULARITY', color: '#e1262c' },
    ];
    const FLOOR = '';   // e.g. '3e étage · 3rd floor' — shown under the room when filled in
    const GAME = 'night/' + ((new URLSearchParams(location.search).get('game') || 'nox2026').replace(/[^a-z0-9-]/gi, '') || 'nox2026');
    const m = document.getElementById('m'), esc = (x) => String(x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function show(r) {
      document.documentElement.style.setProperty('--c', r.color);
      m.innerHTML = `<p class="nox">NOX // EN RETARD · LATE</p><p>Votre salle · <span class="dim">Your room</span></p><div class="room">${esc(r.room)}</div>`
        + (FLOOR ? `<p><b>${esc(FLOOR)}</b></p>` : '')
        + `<div class="band"></div><p>Entrez sans bruit. Votre équipe vous attend.</p><p class="dim">Go in quietly. Your team is waiting.</p>`;
    }
    function fail() { m.innerHTML = '<p class="nox">NOX</p><p>Impossible de trouver votre salle. Demandez à un organisateur.</p><p class="dim">Could not find your room. Ask an organizer.</p>'; }
    (async () => {
      try {
        const C = window.CLUB_PLATFORM, fb = await C.loadFirebase(['auth', 'firestore']);
        const app = fb.apps.find(a => a.name === 'late') || fb.initializeApp(C.FIREBASE, 'late'), auth = app.auth(), db = app.firestore();
        const u = auth.currentUser || await new Promise(res => { const off = auth.onAuthStateChanged(x => { off(); res(x); }); });
        const uid = (u || (await auth.signInAnonymously()).user).uid;
        const mine = await db.doc(GAME + '/players/' + uid).get();
        let team = mine.exists && mine.data().team;
        if (!team) {
          const all = (await db.collection(GAME + '/players').get()).docs.map(d => d.data().team);
          const count = (id) => all.filter(t => t === id).length;
          team = ROOMS.map(r => r.id).sort((a, b) => count(a) - count(b) || Math.random() - .5)[0];
          await db.doc(GAME + '/players/' + uid).set({ name: 'late', team, at: firebase.firestore.FieldValue.serverTimestamp() });
        }
        show(ROOMS.find(r => r.id === team));
      } catch (e) { console.error(e); fail(); }
    })();
  })();
  </script>
</body>
</html>
